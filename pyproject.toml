[project]
name = "rag-pipeline"
version = "0.1.0"
description = "RAG Pipeline - Retrieval-Augmented Generation data collection system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31.0", # Web scraping and HTTP requests
    "beautifulsoup4>=4.12.0", # HTML parsing
    "pydantic>=2.0.0", # Data validation
    "python-dotenv>=1.0.0", # Environment variable management
    "pyyaml>=6.0", # YAML configuration
    "playwright>=1.56.0",
    "html2text>=2025.4.15",
    "pymupdf>=1.26.6",
    "youtube-transcript-api>=1.2.3",
    "yt-dlp>=2025.11.12",
    "openai-whisper",
    "gitpython>=3.1.45",
    "jupyter>=1.1.1",
    "ipykernel>=7.1.0",
    "pandas>=2.3.3",
    "matplotlib>=3.10.7",
    "tiktoken>=0.12.0",
    "chunking-evaluation",
    "openai>=1.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=5.2.0",
    "numpy>=1.24,<2.0",
    "psycopg[binary,pool]>=3.3.2",
    "ollama>=0.4.0",
]
[tool.uv.sources]
chunking-evaluation = { git = "https://github.com/brandonstarxel/chunking_evaluation.git" }
[project.optional-dependencies]
pdf = ["pypdf>=4.0.0", "pdfplumber>=0.10.0"]
video = ["yt-dlp>=2023.0.0", "moviepy>=1.0.0"]
vectordb = ["sentence-transformers>=2.2.0", "psycopg[binary]>=3.1.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "black>=23.0.0", "ruff>=0.1.0"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
